# The Site Configuration — based on the jekyll-theme-chirpy starter config
# (https://github.com/cotes2020/chirpy-starter), trimmed of options we're
# not using, with comments kept where they explain a non-obvious choice.

theme: jekyll-theme-chirpy

lang: en

# Absolute origin of the site, no trailing slash — used by the sitemap,
# canonical tags, and RSS feed to emit full URLs instead of relative
# paths (the sitemap spec requires absolute <loc> values; Google won't
# reliably pick up a sitemap that doesn't have them). Set to the custom
# domain (see CNAME file + SETUP.md §3) rather than the github.io URL,
# now that one's registered. Leave `baseurl` alone — the GitHub Actions
# workflow injects the right one at build time regardless of what's here,
# and a custom domain always serves a project page at the root anyway.
url: "https://mehrdadfk.com"
baseurl: ""

timezone:

# jekyll-seo-tag settings
title: "Mehrdad's Blog"
tagline: "Notes on things I'm building and learning"
description: >-
  Mehrdad's blog about engineering, machine learning, and whatever else
  seems worth writing down.

github:
  username: mehrdadfk

twitter:
  username:

social:
  name: "Mehrdad Fakhimikamran"
  email:
  fediverse_handle:
  links:
    - https://github.com/mehrdadfk
    - https://www.linkedin.com/in/mehrdad-fakhimikamran/

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

# Keep empty to follow system light/dark preference, with a manual toggle.
theme_mode:

cdn:
avatar:
social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# No comment provider wired up yet — pick one (disqus/utterances/giscus)
# later if you want comments.
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # DO NOT change this without updating every internal post link —
      # Chirpy's templates assume this URL shape.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - SETUP.md
  - README.md
  - vendor
  - node_modules
  - tools
  - docs

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
